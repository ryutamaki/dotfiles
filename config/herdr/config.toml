# herdr -- symlinked to ~/.config/herdr/config.toml by bin/setup.sh
#
# herdr is the multiplexer this setup used to do without. It earns the slot by
# offering three things Ghostty does not: panes that survive a closed window,
# one sidebar showing the state of every agent across every project, and a
# socket API an agent can drive from inside its own pane. See CLAUDE.md.
#
# `herdr --default-config` prints every key with its default. Apply an edit to
# the running server with `herdr server reload-config` -- no restart, no lost
# panes. `herdr config check` validates the TOML, and of the values only the
# keybindings: it says `ok` for a color that is not a color, and falls back
# silently on a theme name it does not know, but an unknown key name it names and
# disables. So a keybinding edit is confirmed by `check`; a theme edit is
# confirmed by looking at the sidebar.

# Skip the first-run onboarding flow. Everything it would ask is already
# decided here.
onboarding = false

[theme]
# THE ONE LINE THAT MATTERS, and the one exception to "colors live only in
# config/ghostty/config": herdr's chrome carries its own palette.
#
# The passthrough theme, `name = "terminal"`, is the obvious choice here and does
# not work, for two reasons sixteen ANSI slots cannot fix. A selected sidebar entry
# is marked by filling it, and ANSI has no color meant to be a background -- slot 8
# is chosen to read *on* one -- so that fill measured 2.43:1 against its own text
# on the light half of the pair in config/ghostty/config and 2.18:1 on the dark
# half. And the state dots draw in the color slots, where a high-contrast light
# theme has to darken its yellow to survive white: GitHub Light High Contrast's
# palette 3 is #3f2200, legible at 15:1 and not recognisable as yellow. A dot is a
# glanceable signal, so hue is the requirement there, not contrast.
#
# The cost is bounded, which is the part worth not re-litigating: this palette
# covers sidebar, tab bar, borders and overlays. Pane contents still come from
# Ghostty, and since 0.8.0 a pane app that asks the terminal for its palette gets
# Ghostty's answer (#1752), so every tool listed at the top of
# config/ghostty/config is unaffected.
name = "catppuccin-latte"

# Mandatory once a theme is named, rather than a preference. `panel_bg` follows the
# terminal background even under a named theme, while `surface0` and `surface1`
# come from the theme -- so pinning one half lands a light fill on a dark panel.
# Measured with `catppuccin-latte` pinned against Ghostty's dark half, the selected
# entry's second row fell to 2.0:1 on its own fill. Switching the whole theme keeps
# fill and panel on the same side of the midpoint. `name` above is what applies
# when there is no appearance to follow.
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

# No [theme.custom]. A hex value there hardcodes a color outside both of this
# repo's two sources; `reset` hands the token back to the terminal and is the only
# form worth reaching for. This theme needs neither.

# [terminal] is left at its defaults on purpose. `shell_mode` defaults to
# "auto", which starts login shells on macOS -- that is what runs
# /usr/libexec/path_helper and then .zprofile, which is the half of the PATH
# story that puts $HOME/.local/bin back in front of the system directories.
# Forcing "non_login" here would give every new pane a different PATH than
# every Ghostty tab. See .zsh/path.zsh.

[keys]
# ctrl+b is emacs' backward-char, pressed in every pane here far more often
# than any multiplexer verb, and herdr's default prefix swallows it. So the
# prefix moves. ctrl+t is not a new idea: it was the tmux prefix in this repo
# from 2014 until .tmux.conf was deleted in 3416a9a, and the muscle memory
# outlived the file.
#
# It is not free. `source <(fzf --zsh)` in .zshrc binds ^T to fzf-file-widget,
# and inside a herdr pane the prefix now wins -- as it does over readline's
# transpose-chars. That is the trade taken deliberately: ^B costs a keystroke
# constantly, ^T costs one with a way around it, since ^R still reaches fzf's
# history and Tab completion covers the file case.
prefix = "ctrl+t"

# The other half of the same muscle memory. `prefix+v` is herdr's default for
# a side-by-side split and `|` draws the divider that split makes. The stacked
# split is already `prefix+minus`, which is what .tmux.conf bound `-` to, so it
# needs no line here.
#
# Keys are the one thing `herdr config check` checks by value: an unknown name
# reports `invalid keybinding` and disables that binding, rather than falling
# back silently the way a bad theme name does. Both `pipe` and `bar` are
# rejected -- the literal character is the accepted spelling.
split_vertical = "prefix+|"

# Switching agents is the one move the pane keys cannot make, and it is the move
# this setup makes most. The agents here sit in different workspaces, one per
# project, while focus_pane_h/j/k/l stops at the edge of a tab -- so reaching
# another agent meant prefix+w, pick a workspace, then a pane key, three
# decisions to land somewhere the sidebar was already showing. focus_agent
# collapses that to one chord regardless of workspace, tab or pane: the digit is
# the row in the sidebar's agent panel, counted from the top.
#
# What those digits count is agent_panel_sort at the bottom of this file, which
# is why it is "spaces" and not "priority". "spaces" groups by space and holds
# still, and an index is only worth learning if it holds still; opening or
# closing a workspace is the only thing that shifts one. "priority" reorders the
# panel on every state change, which is useful to walk and impossible to aim at.
#
# The alt here carries a dependency on the other config in this repo:
# `macos-option-as-alt = true` in config/ghostty/config is what makes Option
# arrive as a modifier rather than a composed character. Turn that off for an IME
# and all nine of these stop working with no error to show for it.
focus_agent = "prefix+alt+1..9"

# The same panel without the counting, for the pass over whoever is waiting. j/k
# because the panel is a vertical list and prefix+h/j/k/l is already this motion
# one level in; shift because the unshifted pair is that binding. This is the
# half that still works under "priority", if the sort is ever reconsidered.
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"

# Nothing else is repeated here; `prefix+?` lists every live binding, which is
# a better reference than a copy that can drift. Resize is the one deliberate
# omission rather than an oversight: .tmux.conf had `bind -r H/J/K/L` to nudge
# a border without re-pressing the prefix, and herdr has no repeat binding --
# it has `prefix+r`, a mode. The mode is the replacement; the old binding has
# nothing to map onto.

# The one thing the theme change did not fix. herdr draws the second row of an
# agent entry with SGR 2, which halves its distance to whatever is behind it --
# arithmetic rather than palette, and the named theme is the worse of the two: the
# agent name measured 1.9:1 under `terminal` and 1.5:1 here, 1.4:1 on a filled
# entry. Turning the dim off is the whole fix, and this is the only row that needs
# it; the spaces panel draws its second row in a real color and is left alone.
# Everything else matches the default `rows` value exactly.
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], [{ token = "agent", dim = false }]]

[ui]
agent_panel_sort = "spaces"
